<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ロープ (Rope) - Zen Commander</title>
    <style>
        :root { 
            --accent: #00ffcc; --bg: #0f0f10; --card: #1a1a1b; 
            --primary-btn: #007bff; --success-btn: #28a745;
            --forest-bg: #1b261e; --forest-accent: #a3b18a;
        }
        html, body { height: 100%; overflow: hidden; margin: 0; }
        body { 
            background-color: var(--bg); color: #e0e0e0; font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; box-sizing: border-box; transition: background-color 1.5s; 
        }
        body.forest-mode { background-color: var(--forest-bg); color: #dad7cd; }
        .container { display: flex; flex-direction: column; width: 100%; max-width: 500px; height: 100%; }
        
        /* 統合された出陣ボタン */
        #fetch-btn { display: none; } /* 旧ボタンは非表示 */

        .header-info { flex-shrink: 0; text-align: center; }
        #timer { font-size: 72px; font-weight: 200; margin: 0; color: var(--accent); letter-spacing: -2px; }
        body.forest-mode #timer { color: var(--forest-accent); }
        #target-slot-name { font-size: 24px; color: var(--primary-btn); font-weight: bold; }
        #phase-name { font-size: 32px; color: #ffcc00; font-weight: bold; }
        #phase-msg { font-size: 15px; color: #bbb; height: 3em; margin: 5px 0; line-height: 1.4; }
        
        .content-area { 
            display: none; background: var(--card); border-radius: 12px; padding: 10px; 
            text-align: left; border: 1px solid #333; 
            flex-grow: 1; overflow-y: auto; margin-bottom: 15px;
            -webkit-overflow-scrolling: touch;
        }
        .content-area.active { display: block; }
        body.forest-mode .content-area { background: #344e41; border-color: #588157; }
        
        .task-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #2a2a2b; font-size: 20px; }
        .task-item input[type="checkbox"] { width: 30px; height: 30px; margin-right: 15px; flex-shrink: 0; }
        body.forest-mode .task-item { border-bottom-color: #4a6b53; }

        .footer-action { flex-shrink: 0; padding-bottom: 10px; width: 100%; }
        button#action-btn { 
            width: 100%; padding: 25px; font-size: 24px; cursor: pointer; 
            border: none; border-radius: 16px; font-weight: bold; color: white; transition: 0.3s;
        }
        .btn-start { background: var(--primary-btn); }
        .btn-next { background: var(--success-btn); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-info">
        <div id="target-slot-name">READY</div>
        <div id="phase-name">ROPE</div>
        <div id="timer">00:00</div>
        <div id="phase-msg">任務を同期して、出陣せよ。</div>
    </div>
    <div id="main-content" class="content-area active">
        <div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-style:italic;">
            出陣ボタンを押して任務を同期せよ。
        </div>
    </div>
    <div class="footer-action">
        <button id="action-btn" class="btn-start" onclick="handleAction()">任務同期 & 出陣</button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwxdSKt2gETr_2mRV7sQ4RFKS7j_c79eBAJAX36t2bfEU_gyW0TDHi5hnPbH2VDBi46Jw/exec";
    const slotKeys = ["ポモ①", "ポモ②", "ポモ③", "ポモ④"];
    let currentSlotIndex = 0;
    let currentPhaseIndex = -1;
    let timerId = null;
    let timeLeft = 0;
    let audioCtx = null;
    let noiseNode = null;
    let pomoData = null;

    const phases = [
        { name: "Scout", time: 1 * 60, msg: "解像度を上げよ。" },
        { name: "Rush", time: 20 * 60, msg: "集中。完璧を求めるな。" },
        { name: "Pass", time: 3 * 60, msg: "中継。粗くても投げろ。" },
        { name: "Knot", time: 2 * 60, msg: "結び目。任務を偵察中..." },
        { name: "Clean", time: 1 * 60, msg: "戦場を清めよ。" },
        { name: "Brief", time: 3 * 60, msg: "完全に離れよ。" }
    ];

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function notifyUser() {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); // ビープ音量を少しアップ
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } catch(e) {}
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }

    // ブラウンノイズ（集中用 & 焚き火のベース用）
    function playBrownNoise(volume = 0.05, isFireplace = false) {
        stopNoise();
        try {
            initAudio();
            const bufferSize = 10 * audioCtx.sampleRate;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                output[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = output[i];
                output[i] *= 3.5; // 補正
            }
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            
            if (isFireplace) {
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, audioCtx.currentTime);
                noiseNode.connect(filter);
                filter.connect(gain);
            } else {
                noiseNode.connect(gain);
            }
            
            gain.connect(audioCtx.destination);
            noiseNode.start();
        } catch(e) {}
    }

    function stopNoise() {
        if (noiseNode) { try { noiseNode.stop(); } catch(e){} noiseNode = null; }
    }

    async function fetchTasks(isAuto = false) {
        try {
            const res = await fetch(GAS_URL);
            pomoData = await res.json();
            refreshDisplay();
        } catch (e) { if(!isAuto) alert("同期失敗。"); }
    }

    function refreshDisplay() {
        const main = document.getElementById('main-content');
        main.innerHTML = ""; 
        
        const currentPhaseName = (currentPhaseIndex >= 0 && currentPhaseIndex < phases.length) ? phases[currentPhaseIndex].name : "";
        let listKeyToDisplay = ""; 

        if (currentPhaseIndex === 98) { 
            document.getElementById('target-slot-name').textContent = "REVIEW";
            listKeyToDisplay = "レビュー";
        } else if (currentPhaseIndex === 99) { 
            document.getElementById('target-slot-name').textContent = "FOREST REST";
            listKeyToDisplay = "休息のルーティン";
        } else if (["Clean", "Brief"].includes(currentPhaseName)) {
            main.innerHTML = `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-style:italic;">${currentPhaseName === "Clean" ? "戦場を清めよ..." : "心を解き放て..."}</div>`;
            return;
        } else {
            listKeyToDisplay = slotKeys[currentSlotIndex] || "READY";
            document.getElementById('target-slot-name').textContent = listKeyToDisplay;
        }

        const data = pomoData ? pomoData[listKeyToDisplay] : null;
        if (!data || !data.tasks || data.tasks.length === 0) {
            main.innerHTML += '<div style="color:#444; padding:20px; text-align:center;">（任務なし）</div>';
            return;
        }
        data.tasks.forEach(task => {
            const div = document.createElement('div');
            div.className = "task-item";
            div.innerHTML = `<input type="checkbox" class="task-check" data-id="${task.id}" data-list="${listKeyToDisplay}"> <span>${task.title}</span>`;
            main.appendChild(div);
        });
    }

    async function handleAction() {
        initAudio();
        notifyUser(); // ボタン押下時に必ずビープ

        if (currentPhaseIndex === -1 && !pomoData) {
            // 初回：同期して出陣
            const btn = document.getElementById('action-btn');
            btn.textContent = "偵察中...";
            await fetchTasks();
            startNextPhase();
            return;
        }

        if (timerId) { 
            clearInterval(timerId);
            timerId = null;
            await reportCheckedTasks();
            if (currentPhaseIndex === 98) startForestRest();
            else startNextPhase();
        } else {
            startNextPhase(); 
        }
    }

    function startNextPhase() {
        if (currentPhaseIndex === 99) {
            stopNoise();
            location.reload(); 
            return;
        }

        currentPhaseIndex++;
        if (currentPhaseIndex >= phases.length) {
            currentPhaseIndex = -1;
            currentSlotIndex++;
            if (currentSlotIndex >= slotKeys.length) startGrandReview(); 
            else { setupStandby(); refreshDisplay(); }
            return;
        }

        const p = phases[currentPhaseIndex];
        document.getElementById('phase-name').textContent = p.name;
        document.getElementById('phase-msg').textContent = p.msg;
        timeLeft = p.time;
        
        // 音響制御
        if (p.name === "Rush") playBrownNoise(0.03); // 作業中はブラウンノイズ
        else stopNoise();

        if(p.name === "Knot") fetchTasks(true);

        document.getElementById('action-btn').textContent = `${p.name}完了 (NEXT)`;
        document.getElementById('action-btn').className = "btn-next";
        refreshDisplay();
        startTimer();
    }

    function startGrandReview() {
        document.body.classList.add('forest-mode'); 
        currentPhaseIndex = 98;
        document.getElementById('phase-name').textContent = "REVIEW";
        document.getElementById('phase-msg').textContent = "戦果をチェックせよ。";
        timeLeft = 15 * 60;
        document.getElementById('action-btn').textContent = "振り返り完了";
        document.getElementById('action-btn').className = "btn-next";
        refreshDisplay();
        startTimer();
    }

    function startForestRest() {
        playBrownNoise(0.12, true); // 焚き火（音量アップ & フィルタ）
        currentPhaseIndex = 99; 
        document.getElementById('phase-name').textContent = "FOREST REST";
        document.getElementById('phase-msg').textContent = "休息のルーティンをこなし、英気を養え。";
        timeLeft = 15 * 60;
        document.getElementById('action-btn').textContent = "休息終了 (EXIT)";
        document.getElementById('action-btn').className = "btn-start";
        refreshDisplay();
        startTimer();
    }

    function startTimer() {
        if (timerId) clearInterval(timerId);
        updateDisplay();
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerId = null;
                notifyUser(); // 終了時に必ずビープ
                if (currentPhaseIndex === 98) startForestRest();
                else if (currentPhaseIndex === 99) { }
                else { reportCheckedTasks(); startNextPhase(); }
            }
        }, 1000);
    }

    function updateDisplay() {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('timer').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    async function reportCheckedTasks() {
        if (!pomoData) return;
        
        let slotName = "";
        if (currentPhaseIndex === 98) slotName = "レビュー";
        else if (currentPhaseIndex === 99) slotName = "休息のルーティン";
        else slotName = slotKeys[currentSlotIndex];

        // 【軍律変更】休息のルーティン時は同期・削除を行わない
        if (slotName === "休息のルーティン") return;

        const checks = document.querySelectorAll('.task-check:checked');
        for (let cb of Array.from(checks)) {
            const taskTitle = cb.nextElementSibling.textContent.trim();
            const taskId = cb.getAttribute('data-id');
            const url = `${GAS_URL}?action=complete&slotName=${encodeURIComponent(slotName)}&taskTitle=${encodeURIComponent(taskTitle)}`;
            fetch(url, { mode: 'no-cors' }); 
            if (pomoData[slotName]) {
                pomoData[slotName].tasks = pomoData[slotName].tasks.filter(t => t.id !== taskId);
            }
            cb.parentElement.remove();
        }
    }

    function setupStandby() {
        document.getElementById('target-slot-name').textContent = "READY";
        document.getElementById('phase-name').textContent = "ROPE";
        document.getElementById('timer').textContent = "00:00";
        document.getElementById('phase-msg').textContent = "出陣せよ。";
        const btn = document.getElementById('action-btn');
        btn.textContent = "次ポモ出陣 (START)";
        btn.className = "btn-start";
    }
</script>
</body>
</html>
